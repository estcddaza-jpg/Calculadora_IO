name: Build Android APK

on:
  push:
    branches: [ "mobile", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js Static Web
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Grant Execute Permission to Gradlew
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Android APK (Debug)
        working-directory: frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Distribution
        run: |
          mkdir -p release-apk
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk release-apk/Calculadora_IO.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Calculadora_IO_APK
          path: release-apk/Calculadora_IO.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/mobile' || github.ref == 'refs/heads/main'
        with:
          tag_name: mobile-apk-latest
          name: "Calculadora IO — Android APK (Versión Móvil)"
          body: |
            ### 📱 Instalador APK para Android
            Descarga directa de la aplicación nativa **Calculadora IO** compilada para dispositivos Android.
            
            - **Archivo:** `Calculadora_IO.apk`
            - **Compatibilidad:** Android 8.0+
            - **Arquitectura:** arm64-v8a, armeabi-v7a, x86_64
          files: release-apk/Calculadora_IO.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
